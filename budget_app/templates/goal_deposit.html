{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-header"><h3>Add to Goal: {{ goal.title }}</h3></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Add</button>
            <a href="{% url 'goals' %}" class="btn btn-secondary">Back</a>
        </form>
    </div>
</div>
{% endblock %}
