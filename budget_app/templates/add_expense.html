{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Add New Expense</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Amount ($):</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Category:</label>
                        <select name="category" id="category-select" class="form-control" required onchange="checkCategory()">
                            <option value="">Select...</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Bills">Bills</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="__new__" style="font-weight: bold; color: blue;">+ New Category</option>
                        </select>
                    </div>

                    <div class="mb-3" id="new-category-div" style="display: none;">
                        <label>Custom Category Name:</label>
                        <input type="text" name="new_category_name" id="new-category-input" class="form-control" placeholder="Enter category name">
                    </div>

                    <div class="mb-3">
                        <label>Description:</label>
                        <input type="text" name="description" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Date:</label>
                        <input type="date" name="date" id="expense-date" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Expense</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function checkCategory() {
    const select = document.getElementById('category-select');
    const newCatDiv = document.getElementById('new-category-div');
    const newCatInput = document.getElementById('new-category-input');

    if (select.value === "__new__") {
    newCatDiv.style.display = 'block';
    newCatInput.required = true;
    } else {
    newCatDiv.style.display = 'none';
    newCatInput.required = false;
    }
    }

    // Logical Date: Prevent future dates
    document.getElementById('expense-date').max = new Date().toISOString().split("T")[0];
</script>
{% endblock %}
