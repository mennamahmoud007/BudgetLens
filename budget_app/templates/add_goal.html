{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-header"><h3>Set Saving Goal</h3></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Save Goal</button>
      <a href="{% url 'goals' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
